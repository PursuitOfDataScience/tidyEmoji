<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="866" height="1000" viewBox="0 0 866 1000">
  <defs>
    <clipPath id="hexClip">
      <path d="M433,0 L866,250 L866,750 L433,1000 L0,750 L0,250 Z"/>
    </clipPath>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2B1D6B"/>
      <stop offset="0.45" stop-color="#1D1348"/>
      <stop offset="1" stop-color="#331A5E"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.40"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="haloWarm" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFC147" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#FFC147" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="borderGrad" gradientUnits="userSpaceOnUse" x1="80" y1="120" x2="800" y2="920">
      <stop offset="0" stop-color="#64F0C8"/>
      <stop offset="0.52" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#FFC53D"/>
    </linearGradient>
    <radialGradient id="faceYellow" cx="0.38" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#FFE9A0"/>
      <stop offset="0.72" stop-color="#FFC93F"/>
      <stop offset="1" stop-color="#F5B52E"/>
    </radialGradient>
    <radialGradient id="faceRed" cx="0.38" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#FF9066"/>
      <stop offset="0.75" stop-color="#E8403E"/>
      <stop offset="1" stop-color="#D63031"/>
    </radialGradient>
    <linearGradient id="heartGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF6584"/>
      <stop offset="1" stop-color="#E11D48"/>
    </linearGradient>
    <linearGradient id="barMint" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#53F2BC"/>
      <stop offset="1" stop-color="#14C995"/>
    </linearGradient>
    <linearGradient id="barPink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF8BD3"/>
      <stop offset="1" stop-color="#ED4E9E"/>
    </linearGradient>
    <linearGradient id="barCoral" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFA36A"/>
      <stop offset="1" stop-color="#F1565A"/>
    </linearGradient>
    <linearGradient id="fadeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.45" stop-color="#777777"/>
      <stop offset="0.8" stop-color="#000000"/>
    </linearGradient>
    <mask id="fadeMask">
      <rect x="0" y="0" width="866" height="1000" fill="url(#fadeGrad)"/>
    </mask>
    <pattern id="dotgrid" width="46" height="46" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="8" r="3" fill="#FFFFFF"/>
    </pattern>
    <filter id="blur9" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="blur10" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="blur16" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <path id="sparkle" d="M0,-20 Q4.5,-4.5 20,0 Q4.5,4.5 0,20 Q-4.5,4.5 -20,0 Q-4.5,-4.5 0,-20 Z"/>
    <g id="wordmark" fill="none" stroke-width="19" stroke-linecap="round" stroke-linejoin="round">
      <g stroke="#7DF5D2">
        <path d="M24,-90 L24,-24 Q24,0 46,0"/>
        <path d="M2,-64 L46,-64"/>
        <path d="M71,-62 L71,0"/>
        <circle cx="71" cy="-92" r="10" fill="#7DF5D2" stroke="none"/>
        <circle cx="126" cy="-32" r="32"/>
        <path d="M158,-96 L158,0"/>
        <path d="M176,-64 L203,-3"/>
        <path d="M228,-64 L190,26"/>
      </g>
      <g stroke="#FFD166">
        <path d="M254,-96 L254,0"/>
        <path d="M254,-96 L302,-96"/>
        <path d="M254,-50 L296,-50"/>
        <path d="M254,0 L302,0"/>
        <path d="M326,-64 L326,0"/>
        <path d="M326,-44 Q326,-64 346,-64 Q366,-64 366,-44 L366,0"/>
        <path d="M366,-44 Q366,-64 386,-64 Q406,-64 406,-44 L406,0"/>
        <circle cx="458" cy="-32" r="32"/>
        <path d="M518,-62 L518,4 Q518,30 498,30"/>
        <circle cx="518" cy="-92" r="10" fill="#FFD166" stroke="none"/>
        <path d="M549,-62 L549,0"/>
        <circle cx="549" cy="-92" r="10" fill="#FFD166" stroke="none"/>
      </g>
    </g>
  </defs>

  <g clip-path="url(#hexClip)">
    <!-- background -->
    <rect x="0" y="0" width="866" height="1000" fill="url(#bgGrad)"/>
    <ellipse cx="433" cy="150" rx="430" ry="300" fill="url(#halo)"/>
    <ellipse cx="190" cy="772" rx="260" ry="200" fill="url(#haloWarm)"/>
    <rect x="0" y="0" width="866" height="1000" fill="url(#dotgrid)" opacity="0.07" mask="url(#fadeMask)"/>

    <!-- tibble card -->
    <rect x="165" y="256" width="535" height="388" rx="30" fill="#0A0426" opacity="0.55" filter="url(#blur16)"/>
    <rect x="165" y="240" width="535" height="388" rx="30" fill="#FFFFFF" fill-opacity="0.055" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="2.5"/>

    <!-- row 1: grinning + mint bar -->
    <circle cx="245" cy="317" r="50" fill="#140833" opacity="0.35" filter="url(#blur9)"/>
    <rect x="320" y="286" width="340" height="48" rx="24" fill="url(#barMint)" opacity="0.5" filter="url(#blur10)"/>
    <rect x="320" y="286" width="340" height="48" rx="24" fill="url(#barMint)"/>
    <circle cx="245" cy="310" r="50" fill="url(#faceYellow)"/>
    <ellipse cx="225" cy="296" rx="6.5" ry="11" fill="#5C4200"/>
    <ellipse cx="265" cy="296" rx="6.5" ry="11" fill="#5C4200"/>
    <path d="M217,318 A28,28 0 0 0 273,318 Z" fill="#5C4200"/>
    <rect x="224" y="318" width="42" height="9" rx="4.5" fill="#FFF6E0"/>

    <!-- row 2: heart-eyes + pink bar -->
    <circle cx="245" cy="441" r="50" fill="#140833" opacity="0.35" filter="url(#blur9)"/>
    <rect x="320" y="410" width="236" height="48" rx="24" fill="url(#barPink)" opacity="0.5" filter="url(#blur10)"/>
    <rect x="320" y="410" width="236" height="48" rx="24" fill="url(#barPink)"/>
    <circle cx="245" cy="434" r="50" fill="url(#faceYellow)"/>
    <g fill="url(#heartGrad)">
      <path transform="translate(223,424) scale(1.15)" d="M0,6 C0,2 -2.5,-3.5 -8,-3.5 C-12.5,-3.5 -14.5,0 -14.5,2.5 C-14.5,8 -8,12.5 0,18 C8,12.5 14.5,8 14.5,2.5 C14.5,0 12.5,-3.5 8,-3.5 C2.5,-3.5 0,2 0,6 Z"/>
      <path transform="translate(267,424) scale(1.15)" d="M0,6 C0,2 -2.5,-3.5 -8,-3.5 C-12.5,-3.5 -14.5,0 -14.5,2.5 C-14.5,8 -8,12.5 0,18 C8,12.5 14.5,8 14.5,2.5 C14.5,0 12.5,-3.5 8,-3.5 C2.5,-3.5 0,2 0,6 Z"/>
    </g>
    <path d="M219,452 Q245,474 271,452" fill="none" stroke="#5C4200" stroke-width="8.5" stroke-linecap="round"/>

    <!-- row 3: angry + coral bar -->
    <circle cx="245" cy="565" r="50" fill="#140833" opacity="0.35" filter="url(#blur9)"/>
    <rect x="320" y="534" width="148" height="48" rx="24" fill="url(#barCoral)" opacity="0.5" filter="url(#blur10)"/>
    <rect x="320" y="534" width="148" height="48" rx="24" fill="url(#barCoral)"/>
    <circle cx="245" cy="558" r="50" fill="url(#faceRed)"/>
    <path d="M216,540 L236,549" stroke="#491111" stroke-width="8.5" stroke-linecap="round" fill="none"/>
    <path d="M274,540 L254,549" stroke="#491111" stroke-width="8.5" stroke-linecap="round" fill="none"/>
    <circle cx="227" cy="562" r="5.5" fill="#491111"/>
    <circle cx="263" cy="562" r="5.5" fill="#491111"/>
    <path d="M226,590 Q245,576 264,590" fill="none" stroke="#491111" stroke-width="8.5" stroke-linecap="round"/>

    <!-- sparkles -->
    <use xlink:href="#sparkle" transform="translate(650,196)" fill="#7DF5D2" opacity="0.95"/>
    <use xlink:href="#sparkle" transform="translate(232,172) scale(0.6)" fill="#FFD166" opacity="0.85"/>
    <use xlink:href="#sparkle" transform="translate(736,586) scale(0.45)" fill="#FFFFFF" opacity="0.5"/>
    <use xlink:href="#sparkle" transform="translate(508,872) scale(0.4)" fill="#A78BFA" opacity="0.6"/>

    <!-- wordmark -->
    <use xlink:href="#wordmark" transform="translate(168,790) scale(0.95)" filter="url(#blur10)" opacity="0.4"/>
    <use xlink:href="#wordmark" transform="translate(168,790) scale(0.95)"/>

    <!-- borders -->
    <path d="M433,46.2 L826,273.1 L826,726.9 L433,953.8 L40,726.9 L40,273.1 Z" fill="none" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="2"/>
    <path d="M433,16.2 L852,258.1 L852,741.9 L433,983.8 L14,741.9 L14,258.1 Z" fill="none" stroke="url(#borderGrad)" stroke-width="26" stroke-linejoin="round"/>
  </g>
</svg>
