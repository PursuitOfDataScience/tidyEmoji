# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Coverage has been an open promise since 0.2.0. It runs on push so a drop
# shows up with the commit that caused it.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

name: test-coverage

permissions: read-all

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr, any::xml2
          needs: coverage

      - name: Test coverage
        run: |
          cov <- covr::package_coverage(
            quiet = FALSE,
            clean = FALSE,
            install_path = file.path(normalizePath(Sys.getenv("RUNNER_TEMP"), winslash = "/"), "package")
          )
          print(cov)
          covr::to_cobertura(cov)
          # The upload below needs a CODECOV_TOKEN secret and is allowed to
          # fail without one, so the number has to mean something here too or
          # this job reports success while publishing nothing. 95 is a floor,
          # not a target: the suite has been above 98% since 0.4.0.
          pct <- covr::percent_coverage(cov)
          cat(sprintf("total coverage: %.2f%%\n", pct))
          if (pct < 95) {
            stop(sprintf("coverage fell to %.2f%%, below the 95%% floor", pct))
          }
        shell: Rscript {0}

      # The upload is best-effort and must stay that way. It needs a
      # CODECOV_TOKEN secret, so it fails whenever that is absent, and
      # fail_ci_if_error is false deliberately: a red job over an upload
      # nobody accepted is the reason this job was deferred three times. That
      # is also why the floor above is enforced here rather than by codecov --
      # otherwise this job reports success while publishing nothing.
      # Pinned to the SHA the r-lib template pins (v7).
      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          fail_ci_if_error: false
          files: ./cobertura.xml
          plugins: noop
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Show testthat output
        if: always()
        run: |
          find '${{ runner.temp }}/package' -name 'testthat.Rout*' -exec cat '{}' \; || true
        shell: bash

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-test-failures
          path: ${{ runner.temp }}/package
