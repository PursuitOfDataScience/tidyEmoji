# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  # Weekly, so a dependency release breaking our checks surfaces here rather
  # than in a CRAN email. The catalogue figures are pinned to one `emoji`
  # release, and `emoji`'s version tracks the Unicode emoji version.
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

name: R-CMD-check

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,   r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,   r: 'release'}
          - {os: ubuntu-latest,   r: 'oldrel-1'}
          # DESCRIPTION declares R (>= 4.1.0); oldrel-1 is far above it, so
          # without this job the declared floor was never actually exercised.
          - {os: ubuntu-latest,   r: '4.1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true

  # The package promises that no user-visible ordering depends on the session's
  # collation, and that promise has been broken twice: emoji_to_text()'s
  # shortcode choice in 0.3.0 and emoji_dfm(doc_id =)'s row order in 0.4.0.
  # Both times a plain-locale check was green. This job varies LC_COLLATE and
  # nothing else, so a failure here names collation rather than leaving you to
  # work out which part of the locale moved. The `ctype` job below covers the
  # other half.
  collation:
    runs-on: ubuntu-latest

    name: ubuntu-latest (release, LC_COLLATE=${{ matrix.collate }})

    strategy:
      fail-fast: false
      matrix:
        collate: ['C', 'en_US.UTF-8']

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      LC_COLLATE: ${{ matrix.collate }}

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      # A locale R cannot set is worse than no job: R warns at startup, falls
      # back to C, and the matrix entry then tests the same thing twice while
      # claiming otherwise. Generate it before R starts.
      - name: Make the collation available
        if: matrix.collate != 'C'
        run: |
          sudo locale-gen "${{ matrix.collate }}"
          locale -a | grep -i -E 'en_us|c\.utf' || true
        shell: bash

      - name: Confirm the collation actually took effect
        run: |
          want <- "${{ matrix.collate }}"
          got <- Sys.getlocale("LC_COLLATE")
          cat("LC_COLLATE wanted:", want, "got:", got, "\n")
          cat("LC_CTYPE:", Sys.getlocale("LC_CTYPE"), "\n")
          # Compared case- and separator-insensitively, because glibc reports
          # en_US.utf8 for a request of en_US.UTF-8.
          norm <- function(x) tolower(gsub("[-_.]", "", x))
          if (!identical(norm(got), norm(want))) {
            stop("LC_COLLATE did not take effect: this job would test nothing.")
          }
          # And LC_CTYPE must stay UTF-8, or the UTF-8 in the test files is
          # parsed byte-wise and every detection fixture becomes a different
          # string. That is the trap that makes LC_ALL=C useless here.
          stopifnot(grepl("UTF-8", Sys.getlocale("LC_CTYPE"), ignore.case = TRUE))
        shell: Rscript {0}

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: false

  # The other half of the locale, and the one that has actually cost us bugs.
  # LC_COLLATE above holds LC_CTYPE at UTF-8 deliberately, so until now nothing
  # in this matrix varied LC_CTYPE at all -- and three defects have come from
  # that axis, each a documented answer that moved with the session rather than
  # with the data: tolower() in the case fold, iswspace() behind the whitespace
  # class, and "[[:alnum:]]" in emoji_collocations()'s word trim. All three
  # were green on every flavour here.
  #
  # LC_ALL=C is the right thing to run and not the trap it looks like. The
  # suite is written for it: the four tests that measure R's own
  # transliteration rather than the package stand down behind
  # skip_if_not_utf8(), and the other 14000-odd assertions run. Measured
  # locally, examples and vignette rebuild included.
  #
  # LC_ALL is set on the two steps that need it rather than on the job, so
  # dependency installation still runs in the runner's own locale.
  ctype:
    runs-on: ubuntu-latest

    name: ubuntu-latest (release, LC_ALL=C)

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      # A job that silently stayed UTF-8 would report a pass for the one thing
      # it exists to check, so fail loudly instead.
      - name: Confirm the session really is not UTF-8
        env:
          LC_ALL: C
        run: |
          cat("LC_CTYPE:", Sys.getlocale("LC_CTYPE"), "\n")
          if (isTRUE(l10n_info()[["UTF-8"]])) {
            stop("LC_ALL=C did not take effect: this job would test nothing.")
          }
        shell: Rscript {0}

      - uses: r-lib/actions/check-r-package@v2
        env:
          LC_ALL: C
        with:
          upload-snapshots: false
